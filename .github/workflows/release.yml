name: Android Release CI

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      run: |
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD=${{ secrets.KEYSTORE_ALIAS_PASSWORD }} >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    - name: Build Release
      run: ./gradlew assembleRelease

    - run: |
        cd app/build/outputs/apk/release/
        mv app-release.apk KawinNext-${{ github.ref_name }}.apk
        # Pre-releases for dev/rc tags, stable releases for plain version tags.
        # Passing an empty flag argument would shift gh's positional arguments.
        if [[ "${{ github.ref_name }}" == *-dev* || "${{ github.ref_name }}" == *-rc* ]]; then
          gh release create --prerelease "${{ github.ref_name }}" "KawinNext-${{ github.ref_name }}.apk"
        else
          gh release create "${{ github.ref_name }}" "KawinNext-${{ github.ref_name }}.apk"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
